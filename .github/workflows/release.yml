name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar secrets de credenciais
        shell: bash
        env:
          RETROSYNC_GOOGLE_CLIENT_ID: ${{ secrets.RETROSYNC_GOOGLE_CLIENT_ID }}
          RETROSYNC_TOKEN_PROXY_URL: ${{ secrets.RETROSYNC_TOKEN_PROXY_URL }}
          RETROSYNC_PROXY_SECRET: ${{ secrets.RETROSYNC_PROXY_SECRET }}
        run: |
          missing=()
          if [ -z "$RETROSYNC_GOOGLE_CLIENT_ID" ]; then missing+=(RETROSYNC_GOOGLE_CLIENT_ID); fi
          if [ -z "$RETROSYNC_TOKEN_PROXY_URL" ]; then missing+=(RETROSYNC_TOKEN_PROXY_URL); fi
          if [ -z "$RETROSYNC_PROXY_SECRET" ]; then missing+=(RETROSYNC_PROXY_SECRET); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Secrets de credenciais ausentes: ${missing[*]} — release abortada para não publicar um binário sem credenciais."
            exit 1
          fi
          echo "Secrets de credenciais presentes."

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETROSYNC_GOOGLE_CLIENT_ID: ${{ secrets.RETROSYNC_GOOGLE_CLIENT_ID }}
          RETROSYNC_TOKEN_PROXY_URL: ${{ secrets.RETROSYNC_TOKEN_PROXY_URL }}
          RETROSYNC_PROXY_SECRET: ${{ secrets.RETROSYNC_PROXY_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: RetroSync ${{ github.ref_name }}
          releaseBody: Veja os assets abaixo para baixar e instalar esta versão.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
