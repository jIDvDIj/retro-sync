name: Release

on:
  push:
    branches:
      - main

# Serializa releases: dois pushes seguidos na main não disputam a mesma tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Calcula a próxima versão a partir dos commits (Conventional Commits) e cria a
  # tag UMA vez. Roda antes dos builds, que consomem o resultado via needs/outputs.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.new_version }}
      tag: ${{ steps.tag.outputs.new_tag }}
      # Corpo da release: relnotes manuais + notas geradas pela API do GitHub.
      release_body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo p/ calcular o bump

      - name: Calcular versão e criar tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: app-v
          default_bump: patch # fix→patch, feat→minor, BREAKING→major

      # Combina os destaques manuais (relnotes/vX.Y.md, se existir) com as notas
      # automáticas da API do GitHub (lista de PRs + contribuidores). Se a API
      # falhar, cai no changelog de Conventional Commits calculado pela tag action.
      - name: Montar corpo da release
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
          PREV_TAG: ${{ steps.tag.outputs.previous_tag }}
          VERSION: ${{ steps.tag.outputs.new_version }}
          CHANGELOG: ${{ steps.tag.outputs.changelog }}
        run: |
          body_file=$(mktemp)

          manual="relnotes/v$(echo "$VERSION" | cut -d. -f1,2).md"
          if [ -f "$manual" ]; then
            cat "$manual" >> "$body_file"
            echo "" >> "$body_file"
          fi

          args=(-f tag_name="$TAG")
          # Na primeira release a tag anterior (app-v0.0.0) não existe; nesse caso
          # a API detecta o intervalo sozinha.
          if git rev-parse -q --verify "refs/tags/$PREV_TAG" >/dev/null; then
            args+=(-f previous_tag_name="$PREV_TAG")
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              "${args[@]}" --jq '.body' >> "$body_file"; then
            echo "::warning::generate-notes falhou; usando o changelog de commits."
            printf '%s\n' "$CHANGELOG" >> "$body_file"
          fi

          {
            echo "body<<RELNOTES_EOF"
            cat "$body_file"
            echo ""
            echo "---"
            echo "Baixe o instalador da sua plataforma nos assets abaixo."
            echo "RELNOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds reproduzíveis: timestamp fixo do commit em vez do relógio do runner.
      - name: Definir SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.3.11579264"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validar secrets
        env:
          RETROSYNC_GOOGLE_CLIENT_ID: ${{ secrets.RETROSYNC_GOOGLE_CLIENT_ID }}
          RETROSYNC_TOKEN_PROXY_URL: ${{ secrets.RETROSYNC_TOKEN_PROXY_URL }}
          RETROSYNC_PROXY_SECRET: ${{ secrets.RETROSYNC_PROXY_SECRET }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for v in RETROSYNC_GOOGLE_CLIENT_ID RETROSYNC_TOKEN_PROXY_URL RETROSYNC_PROXY_SECRET \
                    ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD; do
            [ -z "${!v}" ] && missing+=($v)
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Secrets ausentes: ${missing[*]}"
            exit 1
          fi

      - name: Definir versão do app
        run: |
          v="${{ needs.version.outputs.version }}"
          jq --arg v "$v" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json

      - name: Decodificar keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > retrosync.jks

      - name: Build APK Android (aarch64)
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/retrosync.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: retrosync
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          RETROSYNC_GOOGLE_CLIENT_ID: ${{ secrets.RETROSYNC_GOOGLE_CLIENT_ID }}
          RETROSYNC_TOKEN_PROXY_URL: ${{ secrets.RETROSYNC_TOKEN_PROXY_URL }}
          RETROSYNC_PROXY_SECRET: ${{ secrets.RETROSYNC_PROXY_SECRET }}
        run: npm run tauri android build -- --target aarch64

      - name: Remover keystore
        if: always()
        run: rm -f retrosync.jks

      - name: Upload APK e AAB para a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          body: ${{ needs.version.outputs.release_body }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Builds reproduzíveis: timestamp fixo do commit em vez do relógio do runner.
      - name: Definir SOURCE_DATE_EPOCH
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Validar secrets de credenciais
        shell: bash
        env:
          RETROSYNC_GOOGLE_CLIENT_ID: ${{ secrets.RETROSYNC_GOOGLE_CLIENT_ID }}
          RETROSYNC_TOKEN_PROXY_URL: ${{ secrets.RETROSYNC_TOKEN_PROXY_URL }}
          RETROSYNC_PROXY_SECRET: ${{ secrets.RETROSYNC_PROXY_SECRET }}
        run: |
          missing=()
          if [ -z "$RETROSYNC_GOOGLE_CLIENT_ID" ]; then missing+=(RETROSYNC_GOOGLE_CLIENT_ID); fi
          if [ -z "$RETROSYNC_TOKEN_PROXY_URL" ]; then missing+=(RETROSYNC_TOKEN_PROXY_URL); fi
          if [ -z "$RETROSYNC_PROXY_SECRET" ]; then missing+=(RETROSYNC_PROXY_SECRET); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Secrets de credenciais ausentes: ${missing[*]} — release abortada para não publicar um binário sem credenciais."
            exit 1
          fi
          echo "Secrets de credenciais presentes."

      # Injeta a versão calculada no bundle. A version do tauri.conf.json tem
      # precedência sobre o Cargo.toml, então o binário sai batendo com a tag.
      - name: Definir versão do app
        shell: bash
        run: |
          v="${{ needs.version.outputs.version }}"
          jq --arg v "$v" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json
          echo "Versão do bundle definida para $v"

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETROSYNC_GOOGLE_CLIENT_ID: ${{ secrets.RETROSYNC_GOOGLE_CLIENT_ID }}
          RETROSYNC_TOKEN_PROXY_URL: ${{ secrets.RETROSYNC_TOKEN_PROXY_URL }}
          RETROSYNC_PROXY_SECRET: ${{ secrets.RETROSYNC_PROXY_SECRET }}

          # Assinatura + notarização do macOS. O tauri-action só assina/notariza
          # quando estas variáveis estão presentes; sem elas o build sai sem assinatura
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: RetroSync v${{ needs.version.outputs.version }}
          releaseBody: ${{ needs.version.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
