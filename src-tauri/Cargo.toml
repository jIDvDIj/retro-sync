[package]
name = "retro-sync"
version = "0.1.0"
description = "Sincronização automática de saves e configurações de emuladores com o Google Drive"
authors = ["David"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "retro_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
async-trait = "0.1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "http2",
  "charset",
] }

rusqlite = { version = "0.32", features = ["bundled"] }

chrono = { version = "0.4", features = ["serde"] }
url = "2"
open = "5"
dirs = "6"
futures = "0.3"
filetime = "0.2"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Dependências exclusivas do desktop — NÃO compiladas para Android/iOS.
# O process watcher (`sysinfo`) e o autostart ("subir com o sistema") não têm
# equivalente no mobile; lá os gatilhos de sync são manuais / ao abrir o app.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
sysinfo = "0.33"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

# Dependências exclusivas do mobile.
# - deep-link: captura o redirect URI `retrosync://oauth` de volta ao app (OAuth).
# - opener: abre o browser no Android (o crate `open` não funciona em processo sandboxado).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"

# Leitura do registro do Windows para a descoberta de instalações (Sinal B).
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
