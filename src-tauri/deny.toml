# Política de licenças das dependências Rust (cargo-deny).
# Verificado no CI a cada PR; local: sh scripts/check-licenses.sh
#
# A lista abaixo cobre exatamente o que existe hoje na árvore de dependências —
# tudo permissivo e compatível com distribuição pública do binário. Se um novo
# crate trouxer licença fora da lista, o check falha e a decisão de permitir
# (ou trocar o crate) é tomada explicitamente aqui.

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0", # webpki-roots (bundle de certificados raiz)
  "ISC",
  "MIT",
  "MPL-2.0", # cssparser e afins — copyleft fraco, por arquivo; ok p/ distribuição
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# O crate do app (publish = false) não declara license field — ignorado.
private = { ignore = true }
